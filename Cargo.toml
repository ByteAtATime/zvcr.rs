[workspace]
members = ["crates/zvcr", "crates/zvcr_bench", "crates/zvcr_cli"]
resolver = "3"

[workspace.dependencies]
ahash = "0.8.12"
clap = { version = "4", features = ["derive"] }
inventory = "0.3"
rayon = "1"
thiserror = "2.0.19"
zstd = { version = "0.13.3", features = ["zstdmt"] }
fastnbt = "2"
flate2 = "1"
serde_json = "1"
indicatif = { version = "0.17", features = ["rayon"] }
criterion = "0.5"
